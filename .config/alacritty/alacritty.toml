general.import = ["$HOME/.config/alacritty/themes/themes/catppuccin_mocha.toml"]

general.live_config_reload = true

[env]
# wrong TERM setting prevents CopyPaste
# TERM = "screen-256color"
TERM = "xterm-256color"

[window]
option_as_alt = "OnlyLeft"
startup_mode = "Windowed"
dynamic_padding = true
decorations = "Buttonless"
opacity = 0.8
blur = false

[window.dimensions]
columns = 95
lines = 50

[window.padding]
x = 5
y = 5

[scrolling]
history = 50000
multiplier = 3

[font]
size = 14
normal = { family = "Maple Mono Normal NF CN", style = "Regular" }
bold = { family = "Maple Mono Normal NF CN", style = "Bold" }
italic = { family = "Maple Mono Normal NF CN", style = "Italic" }
bold_italic = { family = "Maple Mono Normal NF CN", style = "Bold Italic" }

[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Beam"
blinking = "always"

[selection]
save_to_clipboard = true

# [terminal]
# osc52 = "CopyPaste"
